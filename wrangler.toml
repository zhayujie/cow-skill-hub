name = "cow-skill-hub"
main = "workers/api.js"
compatibility_date = "2024-10-01"

# Cron trigger: sync skills from GitHub every hour
[triggers]
crons = ["0 * * * *"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "cow-skill-hub"
database_id = ""  # Set your D1 database ID here (run: npx wrangler d1 create cow-skill-hub)

# R2 bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cow-skills"

# Environment variables
[vars]
GITHUB_REPO = "zhayujie/chatgpt-on-wechat"
SKILLS_DIR = "skills"
